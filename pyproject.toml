[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-submersion"
version = "0.1.0"
description = "Spectral submersion framework for lost language decipherment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "David Alexander Astudillo Muñoz", email = "satisfimath@gmail.com"}
]
keywords = ["nlp", "svd", "decipherment", "spectral-analysis", "lost-languages"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "networkx",
    "pyyaml",
    "tqdm",
    "rich",
    "jupyter",
    "ipykernel",
    "pytest",
    "pot",
    "pillow",
    "requests",
]

[project.optional-dependencies]
dev = ["black", "flake8", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
spectral-submersion = "spectral_submersion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
