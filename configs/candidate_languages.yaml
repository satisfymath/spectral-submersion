# Candidate languages configuration
# Data sources: OPUS-Tatoeba v2023-04-12 (CC-BY 2.0 FR)
# NOTE: Large raw/token files (>50MB raw, >100MB CSV) are in .gitignore.
#       Regenerate locally via scripts/build_candidate_corpus.py if needed.
# These are real modern languages used as STRUCTURAL candidates.
# They are NOT direct claims about Rongorongo/Indus decipherment.

candidates:
